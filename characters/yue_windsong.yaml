  creature_type: humanoid
  darkvision: 60
  traits:
  - name: Darkvision
    description: You have Darkvision with a range of 60 feet.
  - name: Elven Lineage
    description: You are part of a lineage that grants you supernatural abilities.
      Choose a lineage from Drow, High Elf, or Wood Elf.
  - name: Fey Ancestry
    description: You have Advantage on saving throws you make to avoid or end the
      Charmed condition.
  - name: Keen Senses
    description: You have proficiency in the Perception skill.
  - name: Trance
    description: You don't need to sleep, and magic can't put you to sleep. You can
      finish a Long Rest in 4 hours if you spend those hours in a trancelike meditation,
      during which you retain consciousness.
  languages:
  - Common
  - Elvish
  resistances: []
background:
  name: Acolyte
  backstory: Yue was left at the Windspire Monastery as an infant, wrapped in silk
    and marked with a tattoo no one could decipher. The monks raised her, and she
    took to the Way of the Open Hand with unnerving natural talent. At twenty she
    left to find the meaning of the mark — a task the elders said would take as long
    as it needed. She carries a calm that unsettles people who expect someone her
    size to be harmless.
  personality:
    traits:
    - I speak only when words will accomplish what silence cannot
    - I find beauty in the geometry of a well-executed strike
    ideals:
    - 'Balance: Stillness and motion are the same thing, seen from different angles'
    bonds:
    - The monks of Windspire gave me everything — I will not shame them
    flaws:
    - My patience reads as coldness; I have lost friends who thought I didn't care
  motivations:
  - description: Uncover the origin of the tattoo she was left with as an infant
    priority: 1
    is_secret: true
  - description: Perfect the Quivering Palm technique before she is too old to learn it
    priority: 2
    is_secret: false
  - description: Repay the Windspire Monastery by training a worthy successor
    priority: 3
    is_secret: false
  fears:
  - Losing control of her emotions in battle
