background:
  name: Outlander
  backstory: Vorn grew up among the Ashen Clans of the Frostreach tundra, where survival
    meant fighting wolves, rival clans, and worse. He earned his surname — Ashgrip —
    after dragging a burning war-wagon out of a raid with his bare hands. When his
    clan was scattered by a warlord's mercenary army, Vorn left the tundra with nothing
    but his greataxe and a fury he has never fully learned to contain.
  personality:
    traits:
    - I am always the loudest presence in any room — silence feels like weakness
    - I judge people by the calluses on their hands, not the words in their mouth
    ideals:
    - 'Strength: The world bends to those strong enough to push it'
    bonds:
    - I will reunite what remains of my scattered clan, by blade or by will
    flaws:
    - When my blood is up I don't always know when to stop
  motivations:
  - description: Track down the warlord who destroyed the Ashen Clans
    priority: 1
    is_secret: false
  - description: Find and protect any surviving clan members
    priority: 2
    is_secret: false
  - description: Prove that the old ways of the tundra are not gone
    priority: 3
    is_secret: false
  fears:
  - Dying without avenging the clan
